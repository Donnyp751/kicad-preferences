# How actions map onto KiCad editor frames, how they are categorised for the
# hotkey map, and which overlaps/gaps the checker should care about.

# Frame id -> display name.  Actions with frames ["*"] in the catalog (all
# common.* actions) apply to every frame listed in common_frames.
[frames]
sch = "Schematic Editor"
symedit = "Symbol Editor"
pcb = "PCB Editor"
fpedit = "Footprint Editor"
sim = "Simulator"
"3d" = "3D Viewer"
gerbview = "Gerber Viewer"
pl = "Drawing Sheet Editor"
kicad = "Project Manager"
cvpcb = "Footprint Assignment"

[common_frames]
# The project manager only uses a handful of common actions (open/save/quit),
# so common bindings are not checked against kicad.* actions.
frames = ["sch", "symedit", "pcb", "fpedit", "sim", "3d", "gerbview", "pl", "cvpcb"]

# Alt+<letter> opens the menu with that mnemonic on GTK before KiCad sees the
# key (menubar.cpp: &File &Edit &View &Place Ro&ute &Inspect &Tools P&references &Help).
[menu_mnemonics]
sch = "FEVPITRH"
symedit = "FEVPIRH"
pcb = "FEVPUITRH"
fpedit = "FEVPITRH"

# Corrections where the catalog's source-reference heuristic is wrong.
[frame_overrides]
"eeschema.InteractiveEdit.rotateCW" = ["sch", "symedit"]
"eeschema.InteractiveEdit.rotateCCW" = ["sch", "symedit"]
"eeschema.InteractiveEdit.mirrorH" = ["sch", "symedit"]
"eeschema.InteractiveEdit.mirrorV" = ["sch", "symedit"]
"eeschema.InteractiveEdit.repeatDrawItem" = ["sch", "symedit"]
"eeschema.InteractiveMove.move" = ["sch", "symedit"]
"eeschema.EditorControl.editWithSymbolEditor" = ["sch"]
"eeschema.EditorControl.editLibSymbolWithSymbolEditor" = ["sch"]

# Tools whose actions only run while that tool is active (drawing, routing,
# point editing).  Their keys may overlap global keys on purpose: the active
# tool wins (ACTION_MANAGER::RunHotKey), so these are reported as "layered".
[modal_tools]
tools = [
  "pcbnew.InteractiveRouter.UndoLastSegment",
  "pcbnew.InteractiveRouter.PlaceVia",
  "pcbnew.InteractiveRouter.PlaceBlindVia",
  "pcbnew.InteractiveRouter.PlaceMicroVia",
  "pcbnew.InteractiveRouter.SelLayerAndPlaceVia",
  "pcbnew.InteractiveRouter.SelLayerAndPlaceBlindVia",
  "pcbnew.InteractiveRouter.SelLayerAndPlaceMicroVia",
  "pcbnew.InteractiveRouter.SwitchPosture",
  "pcbnew.InteractiveRouter.CustomTrackViaSize",
  "pcbnew.InteractiveRouter.AttemptFinish",
  "pcbnew.InteractiveRouter.ContinueFromEnd",
  "pcbnew.InteractiveDrawing.arcPosture",
  "pcbnew.InteractiveDrawing.deleteLastPoint",
  "pcbnew.InteractiveDrawing.incWidth",
  "pcbnew.InteractiveDrawing.decWidth",
  "pcbnew.InteractiveDrawing.closeOutline",
  "pcbnew.InteractiveSelection.unrouteSegment",
  "pcbnew.InteractiveEdit.skip",
  "eeschema.InteractiveDrawingLineWireBus.undoLastSegment",
  "eeschema.InteractiveDrawingLineWireBus.switchPosture",
  "eeschema.InteractiveDrawing.deleteLastPoint",
  "eeschema.InteractiveDrawing.closeOutline",
  "common.Interactive.finish",
  "common.Interactive.cycleArcEditMode",
  "common.PointEditor",
  "pcbnew.PointEditor",
  "eeschema.PointEditor",
  "common.Control.cursorClick",
  "common.Control.cursorDblClick",
]

# Sets of actions allowed to share a key (mutually exclusive by state).
[allowed_conflicts]
groups = [
  # explode is enabled for a custom pad, recombine while editing one
  ["pcbnew.PadTool.explodePad", "pcbnew.PadTool.recombinePad", "pcbnew.InteractiveSelection.SelectConnection", "pcbnew.TableEditor.editTable"],
  # simulator / symbol editor file commands live in their own windows
  ["eeschema.Simulation.openWorkbook", "common.Control.open"],
  ["eeschema.Simulation.saveWorkbook", "common.Control.save"],
  ["eeschema.Simulation.saveWorkbookAs", "common.Control.saveAs", "eeschema.SymbolLibraryControl.saveLibraryAs"],
  ["eeschema.Simulation.newAnalysisTab", "eeschema.SymbolLibraryControl.newSymbol", "common.Control.new"],
  # only PCB and Gerbview handle the inactive-layer cycle; elsewhere KiCad falls through to the next action
  ["common.Control.highContrastModeCycle", "eeschema.Simulation.runSimulation"],
  ["pcbnew.ModuleEditor.newFootprint", "common.Control.new"],
  ["eeschema.SymbolLibraryControl.newSymbol", "common.Control.new"],
  ["eeschema.SymbolLibraryControl.saveLibraryAs", "common.Control.saveAs"],
  ["eeschema.Simulation.runSimulation", "eeschema.InteractiveDrawing.placePowerSymbol"],
  # Backspace: undo is global, the drawing/router "undo last segment" variants are modal
  ["common.Interactive.undo", "pcbnew.InteractiveSelection.unrouteSegment"],
  # cursor-click helpers only fire when the canvas has focus and nothing else is bound
  ["common.Control.cursorDblClick", "common.Control.zoomFitSelection"],
  # KiCad's own defaults in the footprint-assignment tool
  ["common.Control.save", "cvpcb.Control.SaveAssociationsToFile", "cvpcb.Control.SaveAssociationsToSchematic"],
  ["common.Interactive.delete", "cvpcb.Association.Delete"],
]

# Same purpose, same place: [schematic action, pcb action] that should share a key.
[equivalents]
pairs = [
  ["eeschema.InteractiveMove.move", "pcbnew.InteractiveMove.move"],
  ["eeschema.InteractiveMove.drag", "pcbnew.InteractiveRouter.Drag45Degree"],
  ["eeschema.InteractiveEdit.rotateCCW", "pcbnew.InteractiveEdit.rotateCcw"],
  ["eeschema.InteractiveEdit.rotateCW", "pcbnew.InteractiveEdit.rotateCw"],
  ["eeschema.InteractiveEdit.properties", "pcbnew.InteractiveEdit.properties"],
  ["eeschema.EditorControl.highlightNet", "pcbnew.EditorControl.highlightNet"],
  ["eeschema.InteractiveDrawing.placeSymbol", "pcbnew.EditorControl.placeFootprint"],
  ["eeschema.InteractiveDrawingLineWireBus.drawWires", "pcbnew.InteractiveRouter.SingleTrack"],
  ["eeschema.InteractiveDrawingLineWireBus.drawLines", "pcbnew.InteractiveDrawing.line"],
  ["eeschema.InteractiveDrawing.placeSchematicText", "pcbnew.InteractiveDrawing.text"],
  ["eeschema.InspectionTool.runERC", "pcbnew.DRCTool.runDRC"],
  ["eeschema.EditorControl.schematicSetup", "pcbnew.EditorControl.boardSetup"],
  ["eeschema.EditorControl.showPcbNew", "pcbnew.EditorControl.showEeschema"],
  ["eeschema.InteractiveSelection.SelectConnection", "pcbnew.InteractiveSelection.SelectConnection"],
  ["eeschema.EditorControl.editWithSymbolEditor", "pcbnew.EditorControl.EditFpInFpEditor"],
  ["eeschema.EditorControl.editLibSymbolWithSymbolEditor", "pcbnew.EditorControl.EditLibFpInFpEditor"],
  ["eeschema.InteractiveEdit.swap", "pcbnew.InteractiveEdit.swap"],
  ["eeschema.InteractiveEdit.repeatDrawItem", "pcbnew.Multichannel.repeatLayout"],
  ["eeschema.InteractiveDrawing.placeDesignBlock", "pcbnew.InteractiveDrawing.placeDesignBlock"],
  ["eeschema.InteractiveDrawing.drawRuleArea", "pcbnew.InteractiveDrawing.ruleArea"],
  ["eeschema.InteractiveDrawing.drawRectangle", "pcbnew.InteractiveDrawing.rectangle"],
  ["eeschema.Align.alignLeft", "pcbnew.AlignAndDistribute.alignLeft"],
  ["eeschema.Align.alignRight", "pcbnew.AlignAndDistribute.alignRight"],
  ["eeschema.Align.alignTop", "pcbnew.AlignAndDistribute.alignTop"],
  ["eeschema.Align.alignBottom", "pcbnew.AlignAndDistribute.alignBottom"],
]

# Actions frequent enough that leaving them without a key is a gap.
[must_bind]
actions = [
  # common
  "common.Interactive.undo", "common.Interactive.redo", "common.Interactive.duplicate",
  "common.Interactive.delete", "common.Interactive.group", "common.Interactive.ungroup",
  "common.Control.showProperties", "common.Control.toggleUnits", "common.Interactive.measureTool",
  "common.Control.gridFast1", "common.Control.gridFast2", "common.Control.zoomFitScreen",
  "common.Control.zoomFitSelection", "common.Interactive.search", "common.Control.showDatasheet",
  # schematic
  "eeschema.InteractiveDrawing.placeSymbol", "eeschema.InteractiveDrawing.placePowerSymbol",
  "eeschema.InteractiveDrawingLineWireBus.drawWires", "eeschema.InteractiveDrawingLineWireBus.drawBuses",
  "eeschema.InteractiveDrawing.placeLabel", "eeschema.InteractiveDrawing.placeGlobalLabel",
  "eeschema.InteractiveDrawing.placeHierarchicalLabel", "eeschema.InteractiveDrawing.placeNoConnect",
  "eeschema.InteractiveDrawing.placeJunction", "eeschema.InteractiveDrawing.placeSchematicText",
  "eeschema.InteractiveDrawing.drawSheet", "eeschema.InteractiveMove.move", "eeschema.InteractiveMove.drag",
  "eeschema.InteractiveEdit.rotateCCW", "eeschema.InteractiveEdit.rotateCW", "eeschema.InteractiveEdit.mirrorH",
