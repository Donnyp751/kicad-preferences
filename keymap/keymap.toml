# KiCad keymap - source of truth for user.hotkeys.
# Only differences from KiCad's built-in defaults are listed; everything else
# keeps its default.  "" unbinds.  Table form: { key = ..., alt = ..., why = ... }

[meta]
kicad = "10.0"
layout = "qwerty"

