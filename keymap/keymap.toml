# KiCad keymap - the source of truth for user.hotkeys.
#
# Base: KiCad Unlocked QWERTY map (Pat Deegan), refined for KiCad 10.
#   * proximity follows frequency   * same purpose, same place
#   * birds of a feather flock      * two-handed combos can live anywhere
# Only differences from KiCad's built-in defaults are listed; every other
# action keeps its default.  "" unbinds.
#   "action.id" = "Key"                                   # primary key, default alt kept
#   "action.id" = { key = "K", alt = "Ctrl+K", why = "" } # alt/why optional
# Entries with `why` are the refinements on top of the KU baseline
# (see docs/ANALYSIS.md).  Validate with `./kprefs check`.

[meta]
kicad = "10.0"
layout = "qwerty"
base = "KiCad Unlocked QWERTY (2025) + refinements"

[bind]

# ==========================================================================
# Common (all editors)
# ==========================================================================

# --- common.Control
"common.Control.cursorDblClick" = ""  # Double-click
"common.Control.cursorDownFast" = ""  # Cursor Down Fast
"common.Control.cursorLeftFast" = ""  # Cursor Left Fast
"common.Control.cursorRightFast" = ""  # Cursor Right Fast
"common.Control.cursorUpFast" = ""  # Cursor Up Fast
"common.Control.gridFast1" = "Z"  # Switch to Fast Grid 1
"common.Control.gridFast2" = "X"  # Switch to Fast Grid 2
"common.Control.gridNext" = "Alt+X"  # Switch to Next Grid
"common.Control.gridPrev" = "Alt+Z"  # Switch to Previous Grid
"common.Control.highContrastModeCycle" = { key = "R", why = "KU: R in PCB; in the schematic Place Power on R still wins (KiCad 10 tries the editor's own user-bound action first)" }  # Inactive Layer View Mode (3-state)
"common.Control.new" = ""  # New...
"common.Control.pageSettings" = "F11"  # Page Settings...
"common.Control.print" = ""  # Print...
"common.Control.showDatasheet" = "H"  # Show Datasheet
"common.Control.showProperties" = "V"  # Properties
"common.Control.toggleGridOverrides" = ""  # Grid Overrides
"common.Control.zoomCenter" = ""  # Center on Cursor
"common.Control.zoomFitSelection" = "End"  # Zoom to Selected Objects
"common.Control.zoomIn" = ""  # Zoom In at Cursor
"common.Control.zoomOut" = ""  # Zoom Out at Cursor

# --- common.Interactive
"common.Interactive.copyAsText" = { key = "Ctrl+Alt+C", why = "freed Ctrl+Shift+C for Draw Circles" }  # Copy as Text
"common.Interactive.duplicate" = "W"  # Duplicate
"common.Interactive.group" = { key = "Ctrl+G", why = "KiCad 10 moved Group to common; KU 'U' binding was lost (U is sch Sheet)" }  # Group Items
"common.Interactive.measureTool" = { key = "M", alt = "F7", why = "frequent in layout; M = Measure (KU moved move to 1); F7 kept as alt" }  # Measure Tool
"common.Interactive.pasteSpecial" = ""  # Paste Special...
"common.Interactive.search" = "Alt+Y"  # Search
"common.Interactive.undo" = { key = "Back", alt = "Ctrl+Z", why = "KU Backspace kept; Ctrl+Z restored as alt for muscle memory" }  # Undo
"common.Interactive.ungroup" = { key = "Ctrl+Shift+G", why = "pairs with Ctrl+G group" }  # Ungroup Items
"common.Interactive.unselectAll" = { key = "", why = "freed Ctrl+Shift+A for Draw Arcs; Esc clears selection" }  # Unselect All

# --- common.SuiteControl
"common.SuiteControl.listHotKeys" = "F1"  # List Hotkeys...
"common.SuiteControl.openPreferences" = "F12"  # Preferences...

